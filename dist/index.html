<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#171e28">
  <meta name="description" content="대한민국의 인공위성과 탐사선">
  <link rel="canonical" href="/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:site_name" content="KSATFiNDER">
  <meta property="og:title" content="KSATFiNDER">
  <meta property="og:description" content="대한민국의 인공위성과 탐사선">
  <meta property="og:url" content="/">
  <meta property="og:image" content="/images/thumbnail.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:alt" content="KSATFiNDER · 대한민국의 인공위성과 탐사선">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="KSATFiNDER">
  <meta name="twitter:description" content="대한민국의 인공위성과 탐사선">
  <meta name="twitter:image" content="/images/thumbnail.png">
  <meta name="twitter:image:alt" content="KSATFiNDER · 대한민국의 인공위성과 탐사선">
  <title>KSATFiNDER</title>
  <link rel="preload" href="/fonts/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/IBMPlexMono-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/NEXONFootballGothicBA1.woff" as="font" type="font/woff" crossorigin>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/map.css">
  <link rel="stylesheet" href="/css/panels.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <script type="importmap">{"imports":{"satellite.js":"/vendor/satellite.es.js","three":"/vendor/three.module.js","three/webgpu":"/vendor/three.webgpu.js","three/tsl":"/vendor/three.tsl.js","three/addons/controls/OrbitControls.js":"/vendor/OrbitControls.js"}}</script>
  <script type="module" src="./app.js"></script>
</head>
<body class="explorer">
  <header class="site-header">
    <div class="header-inner">
      <div class="brand-group">
        <button id="catalog-toggle" class="catalog-toggle" type="button" aria-label="위성 목록 열기" aria-expanded="false" aria-controls="satellite-catalog" title="위성 목록 열기">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <a class="brand" href="./">KSATFiNDER</a>
        <time class="header-clock" id="clock" title="KST · 한국 표준시">--:--:--</time>
      </div>
      <div class="header-actions">
        <a class="license-link" href="/license.html">License</a>
        <nav class="site-nav" aria-label="화면 선택">
          <button type="button" data-view="earth" aria-pressed="true">지구</button>
          <button type="button" data-view="moon" aria-pressed="false">달</button>
        </nav>
      </div>
    </div>
  </header>
  <div class="shell" data-list-open="false">
    <aside id="satellite-catalog" class="sidebar" hidden aria-label="위성 목록">
      <div class="catalog-toolbar">
      <div class="sidebar-heading"><div><h2>위성 목록 <span id="mission-count">—</span></h2><p id="catalog-summary"></p></div><button id="catalog-close" class="catalog-close" type="button" aria-label="위성 목록 닫기"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div>
      <label class="search"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-search preview-icon" aria-hidden="true" focusable="false"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg><input id="search" type="search" aria-label="위성 검색" placeholder="위성 이름 또는 임무" autocomplete="off"><kbd>/</kbd></label>
      <div class="filters" role="group" aria-label="궤도 종류 필터"><button type="button" data-filter="ALL" aria-pressed="true">전체</button><button type="button" data-filter="LEO" aria-pressed="false">저궤도</button><button type="button" data-filter="GEO" aria-pressed="false">정지궤도</button></div>
      </div>
      <div class="catalog-options">
        <label class="status-select">운용 상태<select id="status-filter" aria-label="운용 상태 필터"><option value="ALL">전체</option><option value="active">운용 중</option><option value="retired">운용 종료</option><option value="unknown">운용 미확인</option></select></label>
        <div class="data-actions"><button id="fetch-data" type="button" title="저장 자료 대신 외부 API에서 새로 조회합니다">새로고침</button></div>
      </div>
      <div id="sat-list" class="sat-list" aria-label="위성 선택"></div>
      <div class="sidebar-foot" id="freshness" role="status">
        <div id="data-route">서버 저장 자료 확인 중</div>
        <div id="source-time" hidden></div>
        <div id="data-warning" hidden></div>
      </div>
    </aside>
    <main class="workspace">
      <section class="stage" aria-label="위성 지도">
        <div class="map-frame">
        <div class="map-wrap" id="map-wrap">
          <div id="world-map" class="world-map flat-only" aria-hidden="true"></div>
          <canvas id="map" class="flat-only" aria-label="위성 위치 지도" role="img"></canvas>
          <div id="map-markers" class="map-markers flat-only" aria-label="지도에서 위성 선택"></div>
          <div id="launch-sites" class="launch-sites earth-only flat-only" aria-label="발사장 위치"></div>
          <p id="map-message" class="map-message flat-only" role="status">지구 이미지를 불러오는 중</p>
          <div id="earth-panel" class="space-panel" hidden>
            <div id="earth-scene" class="space-scene">
              <span id="earth-label" class="space-label" hidden></span>
              <span id="earth-hover" class="space-label secondary" hidden></span>
            </div>
            <p id="earth-message" class="space-message" role="status">3D 지구를 불러오는 중</p>
          </div>
          <div id="moon-panel" class="space-panel" hidden>
            <div id="moon-scene" class="space-scene"><span id="moon-label" class="space-label" hidden>다누리</span></div>
            <p id="moon-message" class="space-message" role="status">다누리 궤적을 불러오는 중</p>
          </div>
        </div>
        </div>
      </section>
      <div class="panel-layer" data-expanded="false">
        <div class="detail-dock">
          <section class="selected-panel" id="detail" aria-label="선택한 위성 정보" aria-live="polite">
            <p class="empty" data-detail="empty" hidden>선택한 위성이 없습니다.</p>
            <div data-detail="content">
              <div class="detail-header">
                <div class="detail-heading">
                  <div class="detail-status">
                    <span class="sat-state" data-detail="status">—</span>
                    <span class="sat-state" data-detail="group">—</span>
                    <span class="sat-state" data-detail="agency" hidden></span>
                  </div>
                  <h2 class="detail-name" data-detail="name">위성 정보</h2>
                  <div class="detail-en" data-detail="english">—</div>
                </div>
                <button id="panel-expand" class="detail-toggle" type="button" aria-expanded="false" aria-controls="panel-content" aria-label="위성 정보 펼치기"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg></button>
              </div>
              <div class="panel-content" id="panel-content">
                <dl class="detail-launch">
                  <dt>발사일</dt><dd><time data-detail="launched">—</time> <span>UTC</span></dd>
                  <dt hidden>발사체</dt><dd data-detail="vehicle" hidden></dd>
                  <dt hidden>발사장</dt><dd data-detail="site" hidden></dd>
                  <dt>상세</dt><dd data-detail="description">—</dd>
                </dl>
                <div class="detail-grid" data-detail="earthGrid" hidden>
                  <div><span>고도</span><strong class="orbital-value" data-detail="altitude">—</strong></div>
                  <div><span>공전 주기</span><strong class="orbital-value" data-detail="period">—</strong></div>
                  <div><span>궤도 경사</span><strong class="orbital-value" data-detail="inclination">—</strong></div>
                  <div><span>이심률</span><strong class="orbital-value" data-detail="eccentricity">—</strong></div>
                  <div><span>위도</span><strong class="orbital-value" data-detail="latitude">—</strong></div>
                  <div><span>경도</span><strong class="orbital-value" data-detail="longitude">—</strong></div>
                </div>
                <div class="detail-grid" data-detail="moonGrid" hidden>
                  <div><span>고도</span><strong class="orbital-value" data-detail="moonAltitude">—</strong></div>
                  <div><span>달 중심 거리</span><strong class="orbital-value" data-detail="moonDistance">—</strong></div>
                  <div><span>달 위도</span><strong class="orbital-value" data-detail="moonLatitude">—</strong></div>
                  <div><span>달 경도</span><strong class="orbital-value" data-detail="moonLongitude">—</strong></div>
                  <div><span>지구까지의 거리</span><strong class="orbital-value" data-detail="earthDistance">—</strong></div>
                  <div><span title="2022년 12월 17일 02:45 KST, 1차 달 궤도 진입기동 기준">달 궤도 진입 후</span><strong class="orbital-value" data-detail="lunarElapsed">—</strong></div>
                </div>
                <p class="no-data" data-detail="noData">궤도 자료를 불러오는 중입니다.</p>
              </div>
            </div>
          </section>
          <div class="control-panel" role="group" aria-label="지도 제어">
            <div class="control-tools" role="group" aria-label="지도 도구">
              <div class="map-display-tools">
                <div id="map-mode-controls" class="site-nav" role="group" aria-label="지도 표시">
                  <button type="button" data-map-mode="2d" aria-pressed="true">2D</button>
                  <button type="button" data-map-mode="3d" aria-pressed="false">3D</button>
                </div>
                <div class="site-nav earth-only flat-only" role="group" aria-label="지도 배경">
                  <button type="button" data-surface="map" aria-pressed="false">지도</button>
                  <button type="button" data-surface="satellite" aria-pressed="true">위성</button>
                </div>
              </div>
              <div class="map-controls" role="group" aria-label="지도 확대">
                <button id="zoom-in" class="icon-button" type="button" aria-label="지도 확대"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-zoom-in preview-icon" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/><line x1="11" x2="11" y1="8" y2="14"/><line x1="8" x2="14" y1="11" y2="11"/></svg></button>
                <button id="zoom-out" class="icon-button" type="button" aria-label="지도 축소"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-zoom-out preview-icon" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/><line x1="8" x2="14" y1="11" y2="11"/></svg></button>
                <button id="zoom-reset" type="button">전체</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
